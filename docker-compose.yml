version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: xclone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-xclone_db}
      POSTGRES_USER: ${DB_USERNAME:-xclone_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xclone_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-xclone_user} -d ${DB_NAME:-xclone_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xclone_network

  # Redis Cache & Real-Time Pub/Sub Service
  redis:
    image: redis:7-alpine
    container_name: xclone-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xclone_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  xclone_network:
    driver: bridge
